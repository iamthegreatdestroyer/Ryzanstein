[package]
name = "sigma-api"
version = "0.1.0"
edition = "2021"
description = "Unified API gateway for the Ryzanstein LLM ecosystem"
license = "AGPL-3.0"

[dependencies]
axum = { version = "0.7", features = ["macros"] }
tokio = { version = "1.34", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace", "limit"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.6", features = ["v4"] }
dashmap = "5.5"
jsonwebtoken = "9.2"

[dev-dependencies]
axum-test = "14.0"
