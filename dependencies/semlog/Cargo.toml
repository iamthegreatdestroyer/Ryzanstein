[package]
name = "semlog"
version = "0.1.0"
edition = "2021"
description = "Semantic log compression with queryable compressed format"
license = "Apache-2.0"
repository = "https://github.com/iamthegreatdestroyer/Ryzanstein"

[lib]
name = "semlog"
path = "src/lib.rs"

[[bin]]
name = "semlog"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
clap = { version = "4", features = ["derive"] }
byteorder = "1"
lz4_flex = "0.11"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
fnv = "1"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"
proptest = "1"

[[bench]]
name = "compression"
harness = false
