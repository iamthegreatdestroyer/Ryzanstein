{{- if .Values.modelStorage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.modelStorage.pvc.name }}
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ryzanstein.labels" . | nindent 4 }}
spec:
  accessModes:
    {{- toYaml .Values.modelStorage.pvc.accessModes | nindent 4 }}
  {{- if .Values.modelStorage.pvc.storageClass }}
  storageClassName: {{ .Values.modelStorage.pvc.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.modelStorage.pvc.size }}
{{- end }}

---
{{- if .Values.api.persistence.cache.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "ryzanstein.fullname" . }}-cache
  namespace: {{ .Release.Namespace | quote }}
  labels:
    {{- include "ryzanstein.labels" . | nindent 4 }}
    component: api
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.api.persistence.cache.storageClass }}
  storageClassName: {{ .Values.api.persistence.cache.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.api.persistence.cache.size }}
{{- end }}

