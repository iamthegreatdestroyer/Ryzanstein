[package]
name = "zkaudit"
version = "0.1.0"
edition = "2021"
description = "Zero-knowledge audit trails for the Ryzanstein LLM ecosystem"
license = "AGPL-3.0"

[dependencies]
sha2 = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
