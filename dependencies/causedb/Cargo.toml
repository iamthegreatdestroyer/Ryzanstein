[package]
name = "causedb"
version = "0.1.0"
edition = "2021"
description = "Causal inference database for the Ryzanstein LLM ecosystem"
license = "AGPL-3.0"
repository = "https://github.com/iamthegreatdestroyer/Ryzanstein"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
tokio = { version = "1.35", features = ["full"] }
tracing = "0.1"
uuid = { version = "1.6", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
petgraph = "0.6"
reqwest = { version = "0.11", features = ["json"] }

[dev-dependencies]
tempfile = "3.9"
tokio-test = "0.4"

[features]
default = []
python-bindings = []
simd = []
