[package]
name = "sigma-index"
version = "0.1.0"
edition = "2021"
authors = ["Ryzanstein Team"]
description = "Succinct semantic code index using FM-index + HNSW for sub-millisecond code search"
license = "AGPL-3.0"
repository = "https://github.com/iamthegreatdestroyer/Ryzanstein"

[lib]
name = "sigma_index"
path = "src/lib.rs"

[[bin]]
name = "sigma-index-cli"
path = "src/bin/cli.rs"

[dependencies]
# Succinct data structures
bio = "1.4"
# ANN search
instant-distance = "0.6"
# Tree-sitter incremental parsing
tree-sitter = "0.22"
tree-sitter-python = "0.21"
tree-sitter-rust = "0.21"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-go = "0.21"
tree-sitter-c = "0.21"
tree-sitter-cpp = "0.21"
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
# Async runtime
tokio = { version = "1.35", features = ["full"] }
# Error handling
thiserror = "1.0"
anyhow = "1.0"
# Logging
tracing = "0.1"
tracing-subscriber = "0.3"
# CLI
clap = { version = "4.4", features = ["derive"] }
# File watching
notify = "6.1"
# WASM support
wasm-bindgen = { version = "0.2", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3.9"
proptest = "1.4"
tokio-test = "0.4"

[features]
default = []
wasm = ["wasm-bindgen"]
simd = []

[[bench]]
name = "index_benchmarks"
harness = false
