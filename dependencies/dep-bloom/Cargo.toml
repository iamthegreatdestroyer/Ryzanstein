[package]
name = "dep-bloom"
version = "0.1.0"
edition = "2021"
description = "Probabilistic dependency resolution using Bloom filters for the Ryzanstein LLM ecosystem"
license = "AGPL-3.0"

[dependencies]
bitvec = "1.0"
siphasher = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "bloom_bench"
harness = false
