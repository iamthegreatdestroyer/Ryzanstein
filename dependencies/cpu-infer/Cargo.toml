[package]
name = "cpu-infer"
version = "0.1.0"
edition = "2021"
description = "CPU-optimized inference engine with SIMD for the Ryzanstein LLM ecosystem"
license = "AGPL-3.0"

[dependencies]
rayon = "1.8"
ndarray = "0.15"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.34", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
half = "2.3"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bench]]
name = "inference_bench"
harness = false
