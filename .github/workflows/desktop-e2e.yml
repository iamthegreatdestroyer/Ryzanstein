name: Desktop E2E

# Sprint 8 — E2E QA gate per NEXT_STEPS_MASTER_ACTION_PLAN.md
# Builds the Wails desktop binary, then runs Playwright specs that drive it
# via chromium.connectOverCDP (see ADR-046). Also runs Go unit tests for the
# desktop package on Linux for fast feedback.

on:
    push:
        branches:
            - main
            - "sprint8/**"
    pull_request:
        branches:
            - main
    workflow_dispatch:

permissions:
    contents: read

jobs:
    go-test:
        name: Go unit tests (desktop)
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache: true
                  cache-dependency-path: desktop/go.sum

            - name: Install Linux WebKit/GTK deps
              run: |
                  sudo apt-get update
                  sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

            - name: go test ./desktop/...
              working-directory: desktop
              run: go test ./...

    e2e:
        name: Playwright E2E (Windows)
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Setup Go
              uses: actions/setup-go@v5
              with:
                  go-version: "1.24"
                  cache: true
                  cache-dependency-path: desktop/go.sum

            - name: Setup Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "npm"
                  cache-dependency-path: desktop/e2e/package-lock.json

            - name: Install Wails CLI
              run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0

            - name: Build Wails desktop binary
              working-directory: desktop
              shell: pwsh
              run: |
                  # native_webview2loader: use C++ WebView2Loader which honours
                  # WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS at runtime (the new Go
                  # loader reads AdditionalBrowserArgs at env-init time, ignoring
                  # the env var set by the Playwright fixture).
                  wails build -platform windows/amd64 -o Ryzanstein.exe -devtools -tags native_webview2loader
                  if (-not (Test-Path "build/bin/Ryzanstein.exe")) {
                    Write-Error "Wails build did not produce build/bin/Ryzanstein.exe"
                    exit 1
                  }

            - name: Install E2E dependencies
              working-directory: desktop/e2e
              run: npm ci

            - name: Install Playwright browsers
              working-directory: desktop/e2e
              run: npx playwright install --with-deps chromium

            - name: Run Playwright tests
              working-directory: desktop/e2e
              env:
                  RYZANSTEIN_BIN: ${{ github.workspace }}\desktop\build\bin\Ryzanstein.exe
                  CI: "true"
              run: npx playwright test

            - name: Upload Playwright report
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: desktop/e2e/playwright-report
                  retention-days: 14
                  if-no-files-found: ignore

            - name: Upload Playwright traces
              if: failure()
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-traces
                  path: desktop/e2e/test-results
                  retention-days: 14
                  if-no-files-found: ignore
